<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancioneros generales · Coro Magníficat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --cm-primary: #1e3a5f; --cm-secondary: #2c5282; --cm-accent: #3182ce;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; color: #2d3748; background:#f7fafc; }
    .navbar-custom { background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%); }
    .page-title { color: var(--cm-primary); }
    .card { border:1px solid #e2e8f0; border-radius:.75rem; overflow:hidden; }
    .card-header { background: linear-gradient(135deg, #2c5282 0%, #1e3a5f 100%); color:#fff; font-weight:600; }
    .list-group-item { border:0; border-left:3px solid var(--cm-secondary); padding:.7rem 1rem; }
    .list-group-item:hover { background:#ebf4ff; }
    .list-group-item a { color:#2d3748; text-decoration:none; display:block; }
    .footer { background: var(--cm-primary); color:#cbd5e0; padding:1.5rem 0; margin-top:3rem; }
    .sort-btn {
      font-size:.75rem; line-height:1; padding:.25rem .5rem;
      font-weight:600; letter-spacing:.3px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-custom navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <i class="bi bi-arrow-left me-2"></i>Coro Magníficat
      </a>
    </div>
  </nav>
  <main class="container py-5">
    <h1 class="page-title mb-4"><i class="bi bi-journal-bookmark-fill me-2"></i>Cancioneros generales</h1>
    <div class="card shadow-sm">
  <div class="card-header d-flex align-items-center">
    <span class="me-auto"><i class="bi bi-files me-2"></i>3 archivo(s)</span>
    <button class="btn btn-sm btn-outline-light sort-btn" type="button" data-sort-target="#file-list" title="Ordenar archivos (A→Z / Z→A)">A→Z</button>
  </div>
  <div class="card-body p-0">
    <div class="list-group" id="file-list" data-sort-dir="asc">
      <a href="cancionero_lit_rgico_2019.html" class="list-group-item list-group-item-action"
         data-sort-key="Cancionero 2019">
        <i class="bi bi-file-earmark-text me-2 text-muted"></i>Cancionero 2019
      </a>
      <a href="repertorio1-Adelita-v2.html" class="list-group-item list-group-item-action"
         data-sort-key="Cancionero Adelita">
        <i class="bi bi-file-earmark-text me-2 text-muted"></i>Cancionero Adelita
      </a>
      <a href="SegunEl1erLibroDeAdela_cancionero_v4.html" class="list-group-item list-group-item-action"
         data-sort-key="Cancionero Interactivo v4">
        <i class="bi bi-file-earmark-text me-2 text-muted"></i>Cancionero Interactivo v4
      </a>
    </div>
  </div>
</div>
  </main>
  <footer class="footer">
    <div class="container text-center small">Coro Magníficat · Cancioneros generales</div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  (function () {
    function sortList(listEl, dir) {
      var items = Array.prototype.slice.call(listEl.children);
      items.sort(function (a, b) {
        var ta = (a.getAttribute('data-sort-key') || a.textContent || '').trim().toLowerCase();
        var tb = (b.getAttribute('data-sort-key') || b.textContent || '').trim().toLowerCase();
        var cmp = ta.localeCompare(tb, 'es', { sensitivity: 'base' });
        return dir === 'asc' ? cmp : -cmp;
      });
      items.forEach(function (i) { listEl.appendChild(i); });
    }
    document.querySelectorAll('button.sort-btn[data-sort-target]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var sel = btn.getAttribute('data-sort-target');
        var listEl = document.querySelector(sel);
        if (!listEl) { return; }
        var newDir = (listEl.getAttribute('data-sort-dir') === 'asc') ? 'desc' : 'asc';
        listEl.setAttribute('data-sort-dir', newDir);
        sortList(listEl, newDir);
        btn.textContent = newDir === 'asc' ? 'A\u2192Z' : 'Z\u2192A';
      });
    });
  })();
  </script>
</body>
</html>
