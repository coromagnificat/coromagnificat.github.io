  <style>
    :root {
      --cm-primary: #1e3a5f; --cm-secondary: #2c5282; --cm-accent: #3182ce;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; color: #2d3748; background:#f7fafc; }
    .navbar-custom { background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%); }
    .page-title { color: var(--cm-primary); }
    .card { border:1px solid #e2e8f0; border-radius:.75rem; overflow:hidden; }
    .card-header { background: linear-gradient(135deg, #2c5282 0%, #1e3a5f 100%); color:#fff; font-weight:600; }
    .list-group-item { border:0; border-left:3px solid var(--cm-secondary); padding:.7rem 1rem; }
    .list-group-item:hover { background:#ebf4ff; }
    .list-group-item a { color:#2d3748; text-decoration:none; display:block; }
    .footer { background: var(--cm-primary); color:#cbd5e0; padding:2.5rem 0; margin-top:3rem; }
    .footer a { color:#cbd5e0; text-decoration:none; }
    .footer a:hover { color:#fff; }
    .sort-btn {
      font-size:.75rem; line-height:1; padding:.25rem .5rem;
      font-weight:600; letter-spacing:.3px;
    }

    /* ── Listados con scroll interno: máx. 10 filas visibles ───────────── */
    .song-list,
    .file-list {
      max-height: 450px !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      display: block !important;
      scrollbar-width: thin;
      scrollbar-color: #a0aec0 #edf2f7;
    }
    .song-list::-webkit-scrollbar,
    .file-list::-webkit-scrollbar { width: 6px; }
    .song-list::-webkit-scrollbar-track,
    .file-list::-webkit-scrollbar-track { background: #edf2f7; }
    .song-list::-webkit-scrollbar-thumb,
    .file-list::-webkit-scrollbar-thumb { background: #a0aec0; border-radius: 3px; }
    .song-list::-webkit-scrollbar-thumb:hover,
    .file-list::-webkit-scrollbar-thumb:hover { background: #718096; }

    .song-list .list-group-item,
    .file-list .list-group-item {
      height: 45px !important;
      min-height: 45px !important;
      max-height: 45px !important;
      flex-shrink: 0 !important;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      padding: .55rem 1rem;
    }
    .song-list .list-group-item > a,
    .file-list .list-group-item > a {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-list .list-group-item > a > i,
    .file-list .list-group-item > a > i,
    .file-list .list-group-item > i {
      flex-shrink: 0;
    }

  </style>
</head>

  <main class="container py-5">
    <h1 class="page-title mb-4"><i class="bi bi-brightness-high-fill me-2"></i>Hora Santa</h1>

  <div class="card-header d-flex align-items-center">

    <button class="btn btn-sm btn-outline-light sort-btn" type="button" data-sort-target="#file-list" title="Ordenar archivos (A→Z / Z→A)">A→Z</button>

    <div class="list-group file-list" id="file-list"
         data-sort-dir="asc" style="max-height:450px !important;overflow-y:auto !important;overflow-x:hidden !important;display:block !important;scrollbar-width:thin;scrollbar-color:#a0aec0 #edf2f7;">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script data-goatcounter="https://coromagnificat.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  
  <script>
  (function () {
    // ── Ordenación asc/desc por lista ──────────────────────────────────
    function sortList(listEl, dir) {
      var items = Array.prototype.slice.call(listEl.children);
      items.sort(function (a, b) {
        var ta = (a.getAttribute('data-sort-key') || a.textContent || '').trim().toLowerCase();
        var tb = (b.getAttribute('data-sort-key') || b.textContent || '').trim().toLowerCase();
        var cmp = ta.localeCompare(tb, 'es', { sensitivity: 'base' });
        return dir === 'asc' ? cmp : -cmp;
      });
      items.forEach(function (i) { listEl.appendChild(i); });
    }
    document.querySelectorAll('button.sort-btn[data-sort-target]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var sel = btn.getAttribute('data-sort-target');
        var listEl = document.querySelector(sel);
        if (!listEl) { return; }
        var newDir = (listEl.getAttribute('data-sort-dir') === 'asc') ? 'desc' : 'asc';
        listEl.setAttribute('data-sort-dir', newDir);
        sortList(listEl, newDir);
        btn.textContent = newDir === 'asc' ? 'A\u2192Z' : 'Z\u2192A';
      });
    });

    // ── Refuerzo: máx. 10 filas visibles con scroll interno ───────────
    function enforceMaxHeight() {
      var MAX_H = 450;   // 10 filas × 45 px
      var ROW_H = 45;
      document.querySelectorAll('.song-list, .file-list').forEach(function (ul) {
        ul.style.setProperty('max-height', MAX_H + 'px', 'important');
        ul.style.setProperty('overflow-y', 'auto', 'important');
        ul.style.setProperty('overflow-x', 'hidden', 'important');
        ul.style.setProperty('display', 'block', 'important');
        Array.prototype.forEach.call(ul.children, function (li) {
          li.style.setProperty('height', ROW_H + 'px', 'important');
          li.style.setProperty('min-height', ROW_H + 'px', 'important');
          li.style.setProperty('max-height', ROW_H + 'px', 'important');
          li.style.setProperty('flex-shrink', '0', 'important');
          li.style.setProperty('box-sizing', 'border-box', 'important');
        });
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', enforceMaxHeight);
    } else {
      enforceMaxHeight();
    }
    window.addEventListener('load', enforceMaxHeight);
  })();
  </script>
</body>
